# Render blueprint for the FastAPI backend.
# In the Render dashboard: New + → Blueprint → connect this repo. Render reads
# this file, creates the service, and prompts you for the secret env vars below
# (the ones marked `sync: false`). Fill them from your backend/.env values.
services:
  - type: web
    name: studio-finance-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.15"
      # --- App ---
      - key: STUDIO_NAME
        sync: false
      # Set this to your Vercel frontend URL, e.g. https://studio.vercel.app
      - key: CORS_ORIGINS
        sync: false
      - key: TIMEZONE
        value: "Asia/Kolkata"
      - key: STUDENT_PORTAL_URL
        sync: false
      # --- Supabase ---
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      # --- Admin ---
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_JWT_SECRET
        generateValue: true
      # --- Razorpay ---
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # --- Email (Resend) — optional ---
      - key: RESEND_API_KEY
        sync: false
      - key: REMINDER_FROM_EMAIL
        sync: false
